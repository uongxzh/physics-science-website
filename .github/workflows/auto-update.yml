name: Auto Update Site Content

on:
  schedule:
    # 每周一凌晨 3:00 自动检查更新（UTC 时间）
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      update_type:
        description: '更新类型'
        required: true
        default: 'content'
        type: choice
        options:
          - content
          - experiments
          - videos

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update timestamps
        run: |
          python3 << 'EOF'
          import json
          from datetime import datetime

          today = datetime.now().strftime('%Y-%m-%d')

          # Update experiments.json
          try:
              with open('content/experiments.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              data['last_updated'] = today
              with open('content/experiments.json', 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              print(f"Updated experiments.json: {today}")
          except Exception as e:
              print(f"experiments.json error: {e}")

          # Update videos.json
          try:
              with open('content/videos.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              data['last_updated'] = today
              with open('content/videos.json', 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              print(f"Updated videos.json: {today}")
          except Exception as e:
              print(f"videos.json error: {e}")
          EOF

      - name: Check for changes
        id: git-check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git commit -m "chore: auto-update content timestamps ($(date +%Y-%m-%d))

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push origin gh-pages

      - name: Trigger Vercel redeploy
        if: steps.git-check.outputs.changed == 'true'
        run: |
          echo "Content updated. Vercel will auto-redeploy via git integration."
          echo "If git integration is not connected, run: npx vercel --prod --yes"
